<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0a0a0a"/>

  <!-- Edificio principal (rascacielos) -->
  <rect x="12" y="4" width="8" height="24" fill="#00ff00" opacity="0.9"/>

  <!-- Ventanas edificio principal -->
  <rect x="13" y="6" width="2" height="2" fill="#0a0a0a"/>
  <rect x="17" y="6" width="2" height="2" fill="#0a0a0a"/>
  <rect x="13" y="10" width="2" height="2" fill="#0a0a0a"/>
  <rect x="17" y="10" width="2" height="2" fill="#0a0a0a"/>
  <rect x="13" y="14" width="2" height="2" fill="#0a0a0a"/>
  <rect x="17" y="14" width="2" height="2" fill="#0a0a0a"/>
  <rect x="13" y="18" width="2" height="2" fill="#0a0a0a"/>
  <rect x="17" y="18" width="2" height="2" fill="#0a0a0a"/>
  <rect x="13" y="22" width="2" height="2" fill="#0a0a0a"/>
  <rect x="17" y="22" width="2" height="2" fill="#0a0a0a"/>

  <!-- Edificio izquierdo (mediano) -->
  <rect x="4" y="14" width="6" height="14" fill="#ffffff" opacity="0.8"/>
  <rect x="5" y="16" width="2" height="2" fill="#0a0a0a"/>
  <rect x="5" y="20" width="2" height="2" fill="#0a0a0a"/>
  <rect x="5" y="24" width="2" height="2" fill="#0a0a0a"/>

  <!-- Edificio derecho (pequeño) -->
  <rect x="22" y="20" width="6" height="8" fill="#666666" opacity="0.7"/>
  <rect x="23" y="22" width="2" height="2" fill="#0a0a0a"/>

  <!-- Línea de suelo -->
  <rect x="0" y="28" width="32" height="2" fill="#00ff00" opacity="0.5"/>

  <!-- Símbolo $ en la antena -->
  <rect x="15" y="1" width="2" height="3" fill="#00ff00"/>
</svg>